<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Submission Gateway project</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        @media (max-width: 640px) {
            ::-webkit-scrollbar { width: 4px; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto p-4 sm:p-6 md:p-8">

        <header class="mb-6 md:mb-10 border-b border-gray-700 pb-4 md:pb-6 text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                Hackathon Submission Gateway
            </h1>
            <p class="text-gray-400 mt-2 text-sm md:text-base">Submit your project before the deadline!</p>
            <p class="text-gray-400 mt-2 text-sm md:text-base">1st March 2026, 11:59 PM</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">
            
            <div class="md:col-span-1 bg-gray-800 p-4 md:p-6 rounded-xl shadow-2xl border border-gray-700 h-fit">
                <h2 class="text-xl md:text-2xl font-bold mb-4 md:mb-6 text-blue-400">Submit Project</h2>
                
                <form id="submissionForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Team Name</label>
                        <input type="text" id="teamName" required placeholder="e.g. Byte Me"
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white text-sm md:text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Project Title</label>
                        <input type="text" id="projectTitle" required placeholder="e.g. AI Chatbot"
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white text-sm md:text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">GitHub Repo URL</label>
                        <input type="url" id="githubRepoUrl" required placeholder="https://github.com/..."
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white text-sm md:text-base">
                    </div>
                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                        Submit Hack
                    </button>
                </form>

                <div id="statusMessage" class="mt-4 hidden p-3 rounded-lg text-sm font-medium text-center"></div>
            </div>

            <div class="md:col-span-2 bg-gray-800 p-4 md:p-6 rounded-xl shadow-2xl border border-gray-700">
                <div class="flex justify-between items-center mb-4 md:mb-6">
                    <h2 class="text-xl md:text-2xl font-bold text-purple-400">Live Submissions</h2>
                    <button onclick="fetchSubmissions()" class="text-xs md:text-sm bg-gray-700 hover:bg-gray-600 text-gray-300 py-1 md:py-1.5 px-3 rounded flex items-center transition">
                        Refresh
                    </button>
                </div>

                <div id="submissionsList" class="space-y-4 overflow-y-auto max-h-[488px] md:max-h-[580px] pr-2">
                    <p class="text-gray-500 text-center py-10">Loading submissions...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        function getBackendDomain() {
            const domain = window.location.hostname || window.currentURL;
            const protocolPrefix = "https://";
            const firstDotIndex = domain.indexOf('.');
            const subdomain = domain.substring(0, firstDotIndex);
            const restOfDomain = domain.substring(firstDotIndex);
            return protocolPrefix + subdomain + restOfDomain;
        }
        const API_URL = getBackendDomain() + '/api';

        const form = document.getElementById('submissionForm');
        const listDiv = document.getElementById('submissionsList');
        const statusBox = document.getElementById('statusMessage');

        async function fetchSubmissions() {
            try {
                const response = await fetch(API_URL);
                const submissions = await response.json();

                if (submissions.length === 0) {
                    listDiv.innerHTML = `<p class="text-gray-500 text-center py-10 italic">No projects submitted yet. Be the first!</p>`;
                    return;
                }

                listDiv.innerHTML = submissions.map(sub => `
                    <div class="bg-gray-700 p-4 rounded-lg border border-gray-600 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 sm:gap-0 hover:border-gray-500">
                        <div class="w-full sm:w-auto">
                            <h3 class="font-bold text-base md:text-lg text-white break-words">${sub.projectTitle}</h3>
                            <p class="text-sm text-gray-400">Team: <span class="text-gray-300">${sub.teamName}</span></p>
                            <a href="${sub.githubRepoUrl}" target="_blank" class="text-blue-400 text-sm hover:underline flex items-center mt-1 break-all">
                                View on GitHub
                            </a>
                        </div>
                        <div>
                            <button onclick="deleteSubmission(${sub.id})" class="w-full sm:w-auto text-red-400 hover:text-red-300 bg-red-400/10 hover:bg-red-400/20 py-2 px-3 rounded-lg transition">
                                <span class="material-icons-outlined text-sm mr-2 hidden">delete</span>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                listDiv.innerHTML = `<p class="text-red-400 text-center py-10">Could not connect to the backend server. Is Spring Boot running?</p>`;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                teamName: document.getElementById('teamName').value,
                projectTitle: document.getElementById('projectTitle').value,
                githubRepoUrl: document.getElementById('githubRepoUrl').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showMessage('Success! Project submitted.', 'success');
                    form.reset();
                    fetchSubmissions();
                } else {
                    const errorData = await response.json();
                    showMessage(`Error (${response.status}): ${errorData.message}`, 'error');
                }
            } catch (error) {
                showMessage('Network error. Check console.', 'error');
            }
        });

        async function deleteSubmission(id) {
            if (!confirm('Are you sure you want to delete this submission?')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    fetchSubmissions();
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.message}`);
                }
            } catch (error) {
                alert('Could not delete submission.');
            }
        }

        function showMessage(text, type) {
            statusBox.textContent = text;
            statusBox.className = `mt-4 p-3 rounded-lg text-sm font-medium text-center block ${
                type === 'success' ? 'bg-green-900/50 text-green-400 border border-green-800' : 'bg-red-900/50 text-red-400 border border-red-800'
            }`;
            
            setTimeout(() => { statusBox.classList.add('hidden'); }, 5000);
        }

        fetchSubmissions();
    </script>
</body>
</html>
